      basis: standalone
      columns: 2
      fields:
        cfo: Net Cash generated from / (used in) Operating Activities (A)
    - page: 220
      basis: consolidated
      columns: 3
      fields:
        total_assets: Total Assets
        total_liabilities: Total Liabilities
