logging:
  level: INFO
  format: '%(asctime)s %(levelname)s %(name)s: %(message)s'
downloads:
  timeout_seconds: 90
  max_attempts: 5
  backoff_seconds: 3
  user_agent: PRAHARI research/0.1 (public UCI benchmark; requests)
dates:
  results_lag_days: 90
  annual_report_lag_days: 180
pipeline:
  arenas: [P, U]
  readiness_universe_dates: null
  auto_commit_registration: true
  preparation:
  - {module: scripts.02b_collect_sources, offline: true}
  - {module: scripts.02_market_data, arguments: [--cached-only]}
  - {module: scripts.02d_extract_financials}
  - {module: scripts.02e_collect_fx, offline: true}
  - {module: scripts.03c_collection_status}
  data_validation: scripts.03_validate_manual
  benchmark: scripts.01_benchmark
  universe: scripts.04_build_universe
  features: scripts.05_build_features
  registration: scripts.05b_seal
  replay: scripts.06_replay
  evaluation: scripts.07_evaluate
  diagnostics: scripts.10_diagnostics
  bundle: scripts.08_build_bundle
  report: scripts.09_build_report
  tests: scripts.test_runner
  ui_validation: scripts.validate_app
