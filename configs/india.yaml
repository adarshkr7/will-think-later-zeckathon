events:
  rule_version: uncured-d-v1
  exclude_d_cured_before_final_default: true
  review_date: '2026-10-28'
  review_method: human_verified_docs/VERIFY_EVENTS.md
panel:
  peers_per_case: 3
  minimum_unique_peers: 30
  minimum_cases: 10
  minimum_financial_years: 3
  history_years: 3
  collection_years_before: 4
  target_cases: 12
  target_peers: 36
  stressed_fraction: 0.3333333333333333
  stressed_quantile: 0.75
  match_lag_quarters: 12
  survival_quarters: 8
  selection_rule_version: sector-assets-v1
coverage:
  fisher_alpha: 0.05
  collection_causes: {}
financials:
  required_nonfinancial:
  - total_assets
  - total_liabilities
  - current_assets
  - current_liabilities
  - equity
  - retained_earnings
  - revenue
  - inventory
  - pat
  required_financial:
  - total_assets
  - total_liabilities
  - equity
  - pat
  annual_only_fields:
  - equity_issued
  - cfo
  - shares_outstanding
  - related_party_loans_advances
  - related_party_revenue
  - auditor_opinion
  - going_concern_flag
  - caro_default_flag
  - caro_fraud_flag
  unit_multipliers:
    INR: 1
    INR_lakh: 100000
    INR_crore: 10000000
    INR_million: 1000000
    shares: 1
    shares_lakh: 100000
    shares_million: 1000000
    shares_crore: 10000000
    flag: 1
    text: 1
  source_unit_markers:
    INR_crore: incrore
    INR_million: inmillion
    INR_lakh: inlakh
market:
  start_date: '2011-04-01'
  end_date: '2024-03-31'
  publication_lag_days: 1
  legacy_date_formats: ['%d-%b-%Y', '%d-%b-%y']
  max_forward_fill_sessions: 5
  series:
  - EQ
  - BE
  - BZ
  months:
  - JAN
  - FEB
  - MAR
  - APR
  - MAY
  - JUN
  - JUL
  - AUG
  - SEP
  - OCT
  - NOV
  - DEC
  sample_dates:
  - '2018-09-28'
  legacy_url: https://nsearchives.nseindia.com/content/historical/EQUITIES/{year}/{month}/cm{day}{month}{year}bhav.csv.zip
  index_url: https://nsearchives.nseindia.com/content/indices/ind_close_all_{date}.csv
  index_names:
  - Nifty 500
  - Nifty 50
  legacy_columns:
    SYMBOL: symbol
    SERIES: series
    TIMESTAMP: period_end
    CLOSE: close
    TOTTRDQTY: volume
    ISIN: entity_id
  symbol_only_columns:
    SYMBOL: symbol
    SERIES: series
    TIMESTAMP: period_end
    CLOSE: close
    TOTTRDQTY: volume
  index_columns:
    Index Name: name
    Index Date: period_end
    Closing Index Value: close
  bse_url: https://www.bseindia.com/download/BhavCopy/Equity/EQ{date}_CSV.ZIP
  bse_member: EQ{date}.CSV
  bse_columns:
    SC_CODE: exchange_code
    SC_NAME: symbol
    SC_TYPE: security_type
    CLOSE: close
    NO_OF_SHRS: volume
  bse_equity_type: Q
  exchange_preference:
  - nse
  - bse
  index_aliases:
    S&P CNX Nifty: Nifty 50
    S&P CNX 500: Nifty 500
    CNX Nifty: Nifty 50
    CNX 500: Nifty 500
network:
  interval_seconds: 3
  timeout_seconds: 45
  max_attempts: 5
  block_attempts: 2
  backoff_seconds: 3
  headers:
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0
      Safari/537.36
    Accept: '*/*'
    Referer: https://www.nseindia.com/all-reports
